<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mathemagic – znamienka</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#dedad0; --ink:#1c1d21; }
  html,body { margin:0; height:100%; background:var(--ink); overflow:hidden; font-family:Rubik,system-ui,sans-serif; color-scheme:dark; }
  #c { position:fixed; inset:0; width:100%; height:100%; }
  #ui { position:fixed; left:12px; right:12px; bottom:12px; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .row { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; background:#1c1d21e6; padding:8px; border-radius:12px; pointer-events:auto; transition:opacity .2s; }
  .row span { color:#9a9aa0; font-size:12px; font-weight:600; align-self:center; padding:0 6px; }
  button { font:600 13px Rubik,sans-serif; border:0; border-radius:8px; padding:9px 12px; background:#34353b; color:var(--paper); cursor:pointer; }
  button.on { background:var(--paper); color:var(--ink); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--paper); font-weight:600; background:var(--ink); }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="row" id="modes"></div>
  <div class="row"><button id="bScale">Čísla</button><button id="bTex">Textúra</button><button id="bAO" class="on">Tiene v kútoch</button><button id="bPolar">Silné svetlo</button><button id="bPal" class="on">Paleta</button><button id="bSym2" onclick="this.classList.toggle('on');document.getElementById('bSym').click()">Farebné znaky</button></div>
  <div class="row" id="shadeRow"><span>Farba tieňa</span><span id="shades" style="display:flex;gap:6px;padding:0"></span><button id="bSym">Farby znamienok</button></div>
  <div class="row" id="opts"><span>Veľkosť znamienka</span><span id="sizes" style="display:flex;gap:6px;padding:0"></span><button id="bChar" class="on">Postavy jemnejšie</button><button id="bBlur">Rozmazanie</button><button id="bZoom">Bližšie</button><button id="bNew">Nový svet</button></div>
</div>
<div id="loading">Kreslím znamienkami…</div>
<script type="module" src="znamienka.js"></script>
</body>
</html>
